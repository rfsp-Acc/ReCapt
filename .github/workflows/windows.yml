# Gera o instalador do ReCapt para Windows (NSIS) numa maquina Windows do GitHub.
# Disparo manual em Actions > "Build Windows" > "Run workflow"; o .exe sai como artefato.
# Build de teste: nao publica nada. Versoes para os usuarios saem por release.yml.
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Pasta curta: o build dos shaders do Vulkan passa do limite de 260 caracteres do Windows
      # dentro de src-tauri\target.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Vulkan SDK: o whisper.cpp compila os shaders da placa de video com o glslc dele.
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Muda junto com as opcoes do whisper.cpp abaixo: o cache antigo traria a biblioteca velha.
          key: ggml-portable-vulkan

      - run: pnpm install --frozen-lockfile

      # whisper.cpp compila com cmake e MSVC, que ja vem na imagem windows-latest.
      # GGML_NATIVE=OFF: sem isso o whisper.cpp usa as instrucoes do processador do runner
      # (ex.: AVX-512) e falha em PCs que nao as tem. Fica AVX2,
      # presente em processadores Intel e AMD desde 2013.
      # Sem os artefatos de atualizacao: build de teste nao precisa da chave de assinatura.
      - run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash
        env:
          GGML_NATIVE: "OFF"

      - uses: actions/upload-artifact@v4
        with:
          name: ReCapt-windows
          path: C:/t/release/bundle/nsis/*.exe
