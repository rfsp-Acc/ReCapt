# Gera o instalador do ReCapt para Windows (NSIS) numa maquina Windows do GitHub.
# Disparo manual em Actions > "Build Windows" > "Run workflow"; o .exe sai como artefato.
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Muda junto com as opcoes do whisper.cpp abaixo: o cache antigo traria a biblioteca velha.
          key: ggml-portable

      - run: pnpm install --frozen-lockfile

      # whisper.cpp compila com cmake e MSVC, que ja vem na imagem windows-latest.
      # GGML_NATIVE=OFF: sem isso o whisper.cpp usa as instrucoes do processador do runner
      # (ex.: AVX-512) e fecha na hora de transcrever em PCs que nao as tem. Fica AVX2,
      # presente em processadores Intel e AMD desde 2013.
      - run: pnpm tauri build --bundles nsis
        env:
          GGML_NATIVE: "OFF"

      - uses: actions/upload-artifact@v4
        with:
          name: ReCapt-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
