# Gera o instalador do ReCapt para Windows (NSIS) numa maquina Windows do GitHub.
# Disparo manual em Actions > "Build Windows" > "Run workflow"; o .exe sai como artefato.
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # whisper.cpp compila com cmake e MSVC, que ja vem na imagem windows-latest.
      - run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ReCapt-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
