[package]
name = "recapt"
version = "0.1.2"
description = "Captura, transcricao e analise local de reunioes"
authors = ["Rafael Pedroso"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "recapt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
dirs = "7.0.0"
thiserror = "2.0.21"
cpal = "0.18"
hound = "3.5"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tauri-plugin-process = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Placa de video no Whisper: Metal no Apple Silicon; Vulkan no Windows, que vem com o driver
# de video (NVIDIA, AMD e Intel). Sem placa compativel, o whisper.cpp usa a CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
whisper-rs = "0.16"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# TLS do sistema, como o download do modelo (ver reqwest acima).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

# whisper.cpp sem otimizacao fica lento demais ate para testar em modo dev.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
